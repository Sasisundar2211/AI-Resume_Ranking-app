<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Resume Ranking App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 900px; }
    textarea { width: 100%; min-height: 140px; margin-bottom: 1rem; }
    button { padding: .6rem 1rem; }
    .result { background: #f6f8fa; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>AI Resume Ranking App</h1>
  <p>Paste a job description and resume text for instant scoring.</p>
  <label>Job Description</label>
  <textarea id="job"></textarea>
  <label>Resume</label>
  <textarea id="resume"></textarea>
  <button onclick="rankResume()">Rank Resume</button>
  <div class="result" id="result"></div>
  <script>
    async function rankResume() {
      const job_description = document.getElementById('job').value;
      const resume = document.getElementById('resume').value;
      const resp = await fetch('/api/rank', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ job_description, resume })
      });
      const data = await resp.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
